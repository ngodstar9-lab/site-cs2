name: Build Noor Quran apps

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "apps/scripts/**"
      - ".github/workflows/build-apps.yml"
      - "index.html"
      - "admin.html"
      - "app-icon.svg"
      - "favicon.png"
      - "sw.js"
      - "offline.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: noor-quran-app-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        working-directory: apps
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Dependency install attempt ${attempt}/3"
            if npm install --no-audit --no-fund; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Build Windows installer and portable app
        working-directory: apps
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Windows build attempt ${attempt}/3"
            if npm run build:windows; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: noor-quran-windows
          path: apps/dist/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install app dependencies
        working-directory: apps
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          for attempt in 1 2 3; do
            echo "Dependency install attempt ${attempt}/3"
            if npm install --no-audit --no-fund; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Prepare bundled Quran app
        working-directory: apps
        run: npm run prepare:site

      - name: Create Android project
        working-directory: apps
        run: npx cap add android

      - name: Sync Android project
        working-directory: apps
        run: npx cap sync android

      - name: Build installable APK
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          for attempt in 1 2 3; do
            echo "Android Gradle build attempt ${attempt}/3"
            if ./gradlew --no-daemon assembleDebug; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Stage APK
        run: |
          mkdir -p apps/dist
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk apps/dist/Noor-Quran-Android.apk

      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: noor-quran-android
          path: apps/dist/Noor-Quran-Android.apk
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS DMG and ZIP
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        working-directory: apps
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "Dependency install attempt ${attempt}/3"
            if npm install --no-audit --no-fund; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Build universal macOS app
        working-directory: apps
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "macOS build attempt ${attempt}/3"
            if npm run build:mac; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 20)); fi
          done
          exit 1

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: noor-quran-macos
          path: |
            apps/dist/*.dmg
            apps/dist/*.zip
          if-no-files-found: error
          retention-days: 14

  ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        working-directory: apps
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          for attempt in 1 2 3; do
            echo "Dependency install attempt ${attempt}/3"
            if npm install --no-audit --no-fund; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 15)); fi
          done
          exit 1

      - name: Prepare bundled Quran app
        working-directory: apps
        run: npm run prepare:site

      - name: Create iOS project
        working-directory: apps
        env:
          CAPACITOR_APP_ID: ir.noorquran.ios
        run: npx cap add ios --packagemanager SPM

      - name: Sync iOS project
        working-directory: apps
        env:
          CAPACITOR_APP_ID: ir.noorquran.ios
        run: npx cap sync ios

      - name: Build unsigned iOS app
        working-directory: apps
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        working-directory: apps
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p dist/ios-package/Payload
          cp -R "$APP_PATH" dist/ios-package/Payload/
          cd dist/ios-package
          /usr/bin/zip -qry ../Noor-Quran-iOS-unsigned.ipa Payload
          cd ..
          rm -rf ios-package

      - name: Upload unsigned iOS package
        uses: actions/upload-artifact@v4
        with:
          name: noor-quran-ios-unsigned
          path: apps/dist/Noor-Quran-iOS-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish app downloads
    runs-on: ubuntu-latest
    needs: [windows, android, macos, ios]
    steps:
      - name: Download build packages
        uses: actions/download-artifact@v4
        with:
          pattern: noor-quran-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: noor-quran-apps-${{ github.run_number }}
          name: Noor Quran Apps ${{ github.run_number }}
          make_latest: true
          files: release-assets/*
          generate_release_notes: true
