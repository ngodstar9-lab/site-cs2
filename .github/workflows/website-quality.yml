name: Website quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate HTML references, accessibility basics, and JavaScript syntax
        run: node scripts/check-site.mjs

  axe-accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and axe-core
        run: |
          mkdir -p /tmp/noor-a11y
          npm install --prefix /tmp/noor-a11y --no-save playwright @axe-core/playwright
          /tmp/noor-a11y/node_modules/.bin/playwright install --with-deps chromium
      - name: Run axe WCAG accessibility checks
        env:
          A11Y_NODE_MODULES: /tmp/noor-a11y/node_modules
        run: node scripts/a11y-check.mjs
