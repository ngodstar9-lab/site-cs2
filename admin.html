<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل مدیریت | CS2 ARENA</title>
<style>
:root{color-scheme:dark;--bg:#080a0f;--panel:#111722;--red:#ff3b45;--text:#f5f7fb;--muted:#a5adbb;--line:#293142}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.8}
main{width:min(900px,92%);margin:36px auto}.brand{font-size:1.35rem;font-weight:900}.brand span{color:var(--red)}a{color:#ff8b91}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin:18px 0}
h1{font-size:1.8rem}h2{font-size:1.25rem;margin-top:0}.muted{color:var(--muted)}label{display:block;margin:10px 0 5px}
input{display:block;width:100%;padding:12px;border-radius:9px;border:1px solid #424b5c;background:#080a0f;color:white;font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 16px;background:var(--red);color:white;font-weight:bold;margin-top:12px}
button.secondary{background:#303846}button.danger{background:#8f222b;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.member{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}.member p{margin:0}.status{white-space:pre-wrap;color:#ffb4b8}
[hidden]{display:none!important}@media(max-width:600px){.row{grid-template-columns:1fr}.member{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main>
<div class="brand"><span>CS2</span> ARENA · پنل مدیریت</div>
<p class="muted">برای افزودن یا حذف اعضای فهرست سایت وارد حساب مدیر شو.</p>
<section id="loginPanel" class="panel">
<h1>ورود مدیر</h1>
<form id="loginForm">
<label for="email">ایمیل مدیر</label><input id="email" type="email" autocomplete="username" required>
<label for="password">رمز عبور</label><input id="password" type="password" autocomplete="current-password" required>
<button type="submit">ورود</button>
</form>
</section>
<section id="adminPanel" class="panel" hidden>
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
<h1>مدیریت اعضا</h1><button id="logout" class="secondary" type="button">خروج</button>
</div>
<form id="addForm">
<h2>افزودن عضو جدید</h2>
<div class="row">
<div><label for="name">نام عضو *</label><input id="name" maxlength="80" required></div>
<div><label for="gameId">شناسه بازی (اختیاری)</label><input id="gameId" maxlength="100"></div>
</div>
<label for="role">نقش</label><input id="role" maxlength="80" value="عضو کامیونیتی">
<button type="submit">افزودن عضو</button>
</form>
<hr style="border-color:var(--line);margin:24px 0">
<h2>فهرست اعضا</h2><div id="members">در حال بارگذاری...</div>
</section>
<p id="status" class="status" role="status"></p>
<p><a href="./index.html">← بازگشت به سایت</a></p>
</main>
<script>
const SUPABASE_URL = "https://wizwuaptaypzabmvrwiq.supabase.co";
const SUPABASE_KEY = "sb_publishable_6X8vkKyo0lIOt1LK5HDSWg_eq3qG3Ds";
let accessToken = "";
const $ = id => document.getElementById(id);
function showStatus(message){$("status").textContent=message;}
async function api(path, options={}) {
  const headers = { apikey: SUPABASE_KEY, Authorization: "Bearer " + (accessToken || SUPABASE_KEY), ...(options.headers||{}) };
  const response = await fetch(SUPABASE_URL + path, {...options, headers});
  const raw = await response.text();
  let data = null; try { data = raw ? JSON.parse(raw) : null; } catch {}
  if (!response.ok) throw new Error(data?.msg || data?.message || data?.error_description || raw || ("HTTP " + response.status));
  return data;
}
function setLoggedIn(value){
  $("loginPanel").hidden=value;
  $("adminPanel").hidden=!value;
}
$("loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); showStatus("در حال ورود...");
  try{
    const response=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})
    });
    const data=await response.json();
    if(!response.ok) throw new Error(data.msg||data.message||"ایمیل یا رمز عبور درست نیست.");
    accessToken=data.access_token; setLoggedIn(true); showStatus("ورود موفق بود."); await loadMembers();
  }catch(err){accessToken="";setLoggedIn(false);showStatus("خطا در ورود: "+err.message);}
});
async function loadMembers(){
  $("members").textContent="در حال بارگذاری...";
  try{
    const people=await api("/rest/v1/people?select=id,name,game_id,role,created_at&order=created_at.desc");
    const container=$("members");container.replaceChildren();
    if(!people.length){container.textContent="هنوز عضوی ثبت نشده است.";return;}
    for(const person of people){
      const item=document.createElement("div");item.className="member";
      const info=document.createElement("div");
      const name=document.createElement("p");name.textContent=person.name||"بدون نام";name.style.fontWeight="bold";
      const detail=document.createElement("p");detail.className="muted";detail.textContent=(person.role||"عضو کامیونیتی")+(person.game_id?" · شناسه بازی: "+person.game_id:"");
      info.append(name,detail);
      const del=document.createElement("button");del.className="danger";del.type="button";del.textContent="حذف";
      del.addEventListener("click",async()=>{
        if(!confirm("عضو «"+(person.name||"بدون نام")+"» حذف شود؟"))return;
        del.disabled=true;
        try{await api("/rest/v1/people?id=eq."+encodeURIComponent(person.id),{method:"DELETE",headers:{Prefer:"return=minimal"}});showStatus("عضو حذف شد.");await loadMembers();}
        catch(err){showStatus("خطا در حذف: "+err.message);del.disabled=false;}
      });
      item.append(info,del);container.append(item);
    }
  }catch(err){$("members").textContent="";showStatus("خطا در دریافت اعضا: "+err.message+" — تنظیمات جدول و RLS را بررسی کن.");}
}
$("addForm").addEventListener("submit",async e=>{
  e.preventDefault();showStatus("در حال افزودن عضو...");
  try{
    await api("/rest/v1/people",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify([{name:$("name").value.trim(),game_id:$("gameId").value.trim()||null,role:$("role").value.trim()||"عضو کامیونیتی"}])});
    $("addForm").reset();$("role").value="عضو کامیونیتی";showStatus("عضو با موفقیت اضافه شد.");await loadMembers();
  }catch(err){showStatus("خطا در افزودن عضو: "+err.message+" — مطمئن شو جدول people ساخته شده است.");}
});
$("logout").addEventListener("click",()=>{accessToken="";setLoggedIn(false);$("password").value="";$("members").replaceChildren();showStatus("از پنل خارج شدی.");});
</script>
</body></html>
