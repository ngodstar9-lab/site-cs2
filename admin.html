<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | CS2 ZONE</title>
<style>
:root{color-scheme:dark;--bg:#050d16;--panel:#091522;--panel2:#0d1b2a;--orange:#ff8a00;--text:#f5f7fb;--muted:#a9b5c2;--line:#1b2b3b}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0,#10263a 0,transparent 38%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.9}
main{width:min(1050px,93%);margin:34px auto}.brand{font-size:1.5rem;font-weight:900;letter-spacing:.5px}.brand span{color:var(--orange)}a{color:var(--orange);text-decoration:none}.muted{color:var(--muted)}
.panel{background:linear-gradient(145deg,#0d1b2a,#07121e);border:1px solid var(--line);border-radius:15px;padding:24px;margin:18px 0;box-shadow:0 16px 40px #0005}
h1{font-size:1.7rem;margin:0 0 12px}h2{font-size:1.2rem;margin-top:0;color:#fff}
label{display:block;margin:10px 0 5px;color:#d7e0e9}input,textarea{display:block;width:100%;padding:12px;border-radius:9px;border:1px solid #304357;background:#050d16;color:white;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px #ff8a0022}textarea{min-height:110px;resize:vertical}
button{font:inherit;cursor:pointer;border:0;border-radius:9px;padding:10px 17px;background:var(--orange);color:#111;font-weight:bold;margin-top:12px;transition:.2s}button:hover{filter:brightness(1.12);transform:translateY(-1px)}button.secondary{background:#203246;color:#f4f7fa;border:1px solid #3a5065}button.danger{background:#8e2630;color:white;margin:0}button.small{padding:6px 11px;margin:0;font-size:.85rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.member,.news-item{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);background:#081522;border-radius:10px;padding:13px;margin-top:10px}.member p,.news-item p{margin:0}.status{white-space:pre-wrap;color:#ffbd69}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tabs button{background:#203246;color:#f4f7fa}.tabs button.active{background:var(--orange);color:#111}
hr{border:0;border-top:1px solid var(--line)}[hidden]{display:none!important}
@media(max-width:600px){main{margin:18px auto}.row{grid-template-columns:1fr}.member,.news-item{align-items:flex-start;flex-direction:column}.panel{padding:17px}}
</style></head><body><main>
<div class="brand"><span>CS2</span> ZONE · پنل مدیریت</div><p class="muted">مدیریت اعضا و انتشار اخبار سایت</p>
<section id="loginPanel" class="panel"><h1>ورود مدیر</h1><form id="loginForm"><label for="email">ایمیل مدیر</label><input id="email" type="email" autocomplete="username" required><label for="password">رمز عبور</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">ورود</button></form></section>
<section id="adminPanel" class="panel" hidden>
<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h1>مدیریت سایت</h1><button id="logout" class="secondary" type="button">خروج</button></div>
<div class="tabs"><button type="button" class="active" data-tab="peopleTab">اعضا</button><button type="button" data-tab="newsTab">اخبار</button></div>
<div id="peopleTab">
<form id="addForm"><h2>افزودن عضو</h2><div class="row"><div><label for="name">نام عضو *</label><input id="name" maxlength="80" required></div><div><label for="gameId">شناسه بازی</label><input id="gameId" maxlength="100"></div></div><label for="role">نقش</label><input id="role" maxlength="80" value="عضو کامیونیتی"><button type="submit">افزودن عضو</button></form>
<hr style="border-color:var(--line);margin:24px 0"><h2>فهرست اعضا</h2><div id="members">در حال بارگذاری...</div>
</div>
<div id="newsTab" hidden>
<form id="newsForm"><h2 id="newsFormTitle">انتشار خبر جدید</h2><input id="newsId" type="hidden"><label for="newsTitle">عنوان خبر *</label><input id="newsTitle" maxlength="140" required><label for="newsBody">متن خبر *</label><textarea id="newsBody" maxlength="5000" required></textarea><label for="newsImage">لینک تصویر (اختیاری)</label><input id="newsImage" type="url" placeholder="https://..."><button type="submit" id="newsSubmit">انتشار خبر</button><button type="button" class="secondary" id="cancelEdit" hidden>لغو ویرایش</button></form>
<hr style="border-color:var(--line);margin:24px 0"><h2>خبرهای منتشرشده</h2><div id="newsList">در حال بارگذاری...</div>
</div></section><p id="status" class="status" role="status"></p><p><a href="./index.html">← بازگشت به سایت</a></p></main>
<script>
const SUPABASE_URL="https://wizwuaptaypzabmvrwiq.supabase.co",SUPABASE_KEY="sb_publishable_6X8vkKyo0lIOt1LK5HDSWg_eq3qG3Ds";let accessToken="";
const $=id=>document.getElementById(id);function showStatus(m){$("status").textContent=m}
async function api(path,options={}){const headers={apikey:SUPABASE_KEY,Authorization:"Bearer "+(accessToken||SUPABASE_KEY),...(options.headers||{})};const r=await fetch(SUPABASE_URL+path,{...options,headers});const raw=await r.text();let d=null;try{d=raw?JSON.parse(raw):null}catch{}if(!r.ok)throw new Error(d?.message||d?.msg||d?.error_description||raw||("HTTP "+r.status));return d}
function setLoggedIn(v){$("loginPanel").hidden=v;$("adminPanel").hidden=!v}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();showStatus("در حال ورود...");try{const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.msg||d.message||"ایمیل یا رمز عبور درست نیست.");accessToken=d.access_token;setLoggedIn(true);showStatus("ورود موفق بود.");await Promise.all([loadMembers(),loadNews()])}catch(err){accessToken="";setLoggedIn(false);showStatus("خطا در ورود: "+err.message)}});
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));$("peopleTab").hidden=b.dataset.tab!=="peopleTab";$("newsTab").hidden=b.dataset.tab!=="newsTab"}));
async function loadMembers(){const box=$("members");box.textContent="در حال بارگذاری...";try{const people=await api("/rest/v1/people?select=id,name,game_id,role,created_at&order=created_at.desc");box.replaceChildren();if(!people.length){box.textContent="هنوز عضوی ثبت نشده است.";return}for(const p of people){const item=document.createElement("div");item.className="member";const info=document.createElement("div");const n=document.createElement("p");n.textContent=p.name;n.style.fontWeight="bold";const d=document.createElement("p");d.className="muted";d.textContent=(p.role||"عضو کامیونیتی")+(p.game_id?" · شناسه: "+p.game_id:"");info.append(n,d);const actions=document.createElement("div");actions.style.display="flex";actions.style.gap="8px";const edit=document.createElement("button");edit.className="small secondary";edit.textContent="ویرایش";edit.onclick=()=>{const nn=prompt("نام عضو:",p.name);if(nn===null)return;if(!nn.trim()){showStatus("نام نمی‌تواند خالی باشد.");return}const gg=prompt("شناسه بازی:",p.game_id||"");if(gg===null)return;const rr=prompt("نقش:",p.role||"عضو کامیونیتی");if(rr===null)return;updatePerson(p.id,{name:nn.trim(),game_id:gg.trim()||null,role:rr.trim()||"عضو کامیونیتی"})};const del=document.createElement("button");del.className="small danger";del.textContent="حذف";del.onclick=async()=>{if(!confirm("این عضو حذف شود؟"))return;try{await api("/rest/v1/people?id=eq."+p.id,{method:"DELETE",headers:{Prefer:"return=minimal"}});showStatus("عضو حذف شد.");await loadMembers()}catch(err){showStatus("خطا در حذف: "+err.message)}};actions.append(edit,del);item.append(info,actions);box.append(item)}}catch(err){box.textContent="";showStatus("خطا در دریافت اعضا: "+err.message)}}
async function updatePerson(id,data){try{await api("/rest/v1/people?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(data)});showStatus("اطلاعات عضو ویرایش شد.");await loadMembers()}catch(err){showStatus("خطا در ویرایش عضو: "+err.message)}}
$("addForm").addEventListener("submit",async e=>{e.preventDefault();try{await api("/rest/v1/people",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify([{name:$("name").value.trim(),game_id:$("gameId").value.trim()||null,role:$("role").value.trim()||"عضو کامیونیتی"}])});$("addForm").reset();$("role").value="عضو کامیونیتی";showStatus("عضو اضافه شد.");await loadMembers()}catch(err){showStatus("خطا در افزودن عضو: "+err.message)}});
function resetNewsForm(){$("newsForm").reset();$("newsId").value="";$("newsFormTitle").textContent="انتشار خبر جدید";$("newsSubmit").textContent="انتشار خبر";$("cancelEdit").hidden=true}
$("cancelEdit").onclick=resetNewsForm;
$("newsForm").addEventListener("submit",async e=>{e.preventDefault();const id=$("newsId").value;const payload={title:$("newsTitle").value.trim(),body:$("newsBody").value.trim(),image_url:$("newsImage").value.trim()||null};try{if(id){await api("/rest/v1/news?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(payload)});showStatus("خبر ویرایش شد.")}else{await api("/rest/v1/news",{method:"POST",headers:{"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify([payload])});showStatus("خبر منتشر شد.")}resetNewsForm();await loadNews()}catch(err){showStatus("خطا در ذخیره خبر: "+err.message+" — اگر جدول news را نساختی، فایل SQL را اجرا کن.")}});
async function loadNews(){const box=$("newsList");box.textContent="در حال بارگذاری...";try{const rows=await api("/rest/v1/news?select=id,title,body,image_url,created_at&order=created_at.desc");box.replaceChildren();if(!rows.length){box.textContent="هنوز خبری منتشر نشده است.";return}for(const n of rows){const item=document.createElement("div");item.className="news-item";const info=document.createElement("div");const title=document.createElement("p");title.textContent=n.title;title.style.fontWeight="bold";const body=document.createElement("p");body.className="muted";body.textContent=n.body.slice(0,150);info.append(title,body);const actions=document.createElement("div");actions.style.display="flex";actions.style.gap="8px";const edit=document.createElement("button");edit.className="small secondary";edit.textContent="ویرایش";edit.onclick=()=>{$("newsId").value=n.id;$("newsTitle").value=n.title;$("newsBody").value=n.body;$("newsImage").value=n.image_url||"";$("newsFormTitle").textContent="ویرایش خبر";$("newsSubmit").textContent="ذخیره تغییرات";$("cancelEdit").hidden=false;document.querySelector('[data-tab="newsTab"]').click();$("newsTitle").focus()};const del=document.createElement("button");del.className="small danger";del.textContent="حذف";del.onclick=async()=>{if(!confirm("این خبر حذف شود؟"))return;try{await api("/rest/v1/news?id=eq."+n.id,{method:"DELETE",headers:{Prefer:"return=minimal"}});showStatus("خبر حذف شد.");await loadNews()}catch(err){showStatus("خطا در حذف خبر: "+err.message)}};actions.append(edit,del);item.append(info,actions);box.append(item)}}catch(err){box.textContent="";showStatus("دریافت اخبار: "+err.message+" — ابتدا فایل supabase_setup.sql را اجرا کن.")}}
$("logout").onclick=()=>{accessToken="";setLoggedIn(false);$("password").value="";$("members").replaceChildren();$("newsList").replaceChildren();showStatus("از پنل خارج شدی.")};
</script></body></html>
